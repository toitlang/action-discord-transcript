name: Update README

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Update README to given version'
        required: true
        type: string

env:
  ACTION_VERSION:
    ${{ github.event.inputs.version || github.event.release.tag_name || '' }}
  HASH_MARKER: '${HASH}'
  VERSION_MARKER: '${VERSION}'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout for release
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout for push
        if: github.event_name != 'release'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Update the README
        run: |
          # Replace the old hash and version with the new hash and version in
          # the README.md file.
          sed -i 's/uses: toitlang\/action-discord-transcript@v.*/uses: toitlang\/action-discord-transcript@${{ env.ACTION_VERSION }}/g' README.md

          git config --local user.email "leon@toit.io"
          git config --local user.name "Toit CI"
          git commit -am "Update README"
          git push
