name: 'Discord help exporter'
description: 'Create a Discord transcript for the help forum.'
branding:
  icon: help-circle
  color: yellow

inputs:
  discord-token:
    description: 'The Discord bot credentials.'
    required: true
  guild-id:
    description: 'The guild id.'
    required: true
  transcript-directory:
    description: 'The directory to store the transcript.'
    required: true

runs:
  using: 'node20'
  main: 'dist/index.js'
